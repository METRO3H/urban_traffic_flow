version: "3.9"

services:
   mysql:
      image: mysql:8.0
      container_name: db
      restart: always
      environment:
         MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
         MYSQL_DATABASE: ${MYSQL_DATABASE}
         MYSQL_USER: ${MYSQL_USER}
         MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ports:
         - "3306:3306"
      volumes:
         - db_data:/var/lib/mysql
         # Copying all files from db_init folder to the container in the /docker-entrypoint-initdb.d directory
         - ./db_init:/docker-entrypoint-initdb.d
      networks:
         - netuworku
   scraper:
      build: ./scraper
      container_name: scraper
      depends_on:
         - mysql

      # Passing environment variables to the container
      environment:
         - DB_HOST=mysql
         - DB_USER=${MYSQL_USER}
         - DB_PASSWORD=${MYSQL_PASSWORD}
         - DB_NAME=${MYSQL_DATABASE}
      networks:
         - netuworku

volumes:
   db_data:  # Defining a volume for the MySQL data

networks:
   netuworku:
      driver: bridge


